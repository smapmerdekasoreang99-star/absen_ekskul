<body style="padding-bottom:24px">

<main class="masuk">
  <img src="assets/logo-kecil.png" width="34" height="34" alt="Lambang SMA Plus Merdeka Soreang">
  <h1>Absensi Ekstrakurikuler</h1>
  <p class="ket">SMA Plus Merdeka Soreang</p>

  <div id="kotakPesan" class="pesan p-salah sembunyi"></div>
  <div class="pesan p-info sembunyi" data-mode-contoh>
    Mode contoh. PIN pembina mana pun: <strong>1234</strong>.
  </div>

  <section class="kartu">
    <div class="pilih-peran" id="pilihPeran">
      <button type="button" data-peran="pembina" aria-pressed="true">Pembina / pelatih</button>
      <button type="button" data-peran="pengelola" aria-pressed="false">Pengelola sekolah</button>
    </div>

    <div id="bagianPembina">
      <label for="pilihNama">Nama Anda</label>
      <select id="pilihNama"><option>Memuat…</option></select>
      <button class="tbl tbl-kecil sembunyi" id="cobaLagi" type="button" style="margin-top:8px">Coba lagi</button>
      <div style="height:12px"></div>
      <label for="pinPembina">PIN</label>
      <input id="pinPembina" type="password" inputmode="numeric" autocomplete="off" placeholder="4 angka">
    </div>

    <div id="bagianPengelola" class="sembunyi">
      <label for="pinPengelola">PIN pengelola</label>
      <input id="pinPengelola" type="password" autocomplete="off" placeholder="PIN kesiswaan">
      <p class="ket" style="margin:8px 0 0">Untuk Wakasek Kesiswaan, staf, dan pimpinan.
        Bisa melihat semua ekstrakurikuler dan rekapitulasinya.</p>
    </div>

    <button class="tbl tbl-utama" id="tombolMasuk" type="button" style="width:100%;margin-top:16px">Masuk</button>
  </section>

  <p class="ket" style="font-size:12.5px">Sesi berakhir saat peramban ditutup.
    Jangan bagikan PIN kepada siswa.</p>
</main>

<script type="module" src="scripts/masuk.js?v=20260923b"></script>
</body>
</html>
